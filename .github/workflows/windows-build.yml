name: Build Windows (one-folder)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --name "ExamArenaServer" `
            --add-data "src\resources;src\resources" `
            run.py

      - name: Upload artifact (folder build)
        uses: actions/upload-artifact@v4
        with:
          name: ExamArenaServer-windows-onedir
          path: dist/ExamArenaServer/
