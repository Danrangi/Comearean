name: Build Exam Arena Offline Setup (Windows)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          } else {
            pip install flask flask-sqlalchemy flask-wtf cryptography waitress reportlab pillow pyinstaller python-dotenv
          }

      - name: Download offline assets (Bootstrap + FontAwesome)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "src/resources/static/vendor/css" -Force | Out-Null
          New-Item -ItemType Directory -Path "src/resources/static/vendor/js" -Force | Out-Null
          New-Item -ItemType Directory -Path "src/resources/static/vendor/webfonts" -Force | Out-Null

          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" -OutFile "src/resources/static/vendor/css/bootstrap.min.css"
          Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" -OutFile "src/resources/static/vendor/js/bootstrap.bundle.min.js"

          Invoke-WebRequest -Uri "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" -OutFile "src/resources/static/vendor/css/all.min.css"
          Invoke-WebRequest -Uri "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-solid-900.woff2"  -OutFile "src/resources/static/vendor/webfonts/fa-solid-900.woff2"
          Invoke-WebRequest -Uri "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-regular-400.woff2" -OutFile "src/resources/static/vendor/webfonts/fa-regular-400.woff2"
          Invoke-WebRequest -Uri "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/webfonts/fa-brands-400.woff2"  -OutFile "src/resources/static/vendor/webfonts/fa-brands-400.woff2"

      - name: Prepare icon (fallback)
        shell: pwsh
        run: |
          $iconPath = "src/resources/static/img/logo.ico"
          if (-not (Test-Path $iconPath)) {
            python -c "from PIL import Image; img=Image.new('RGB',(64,64),(0,128,0)); img.save(r'src/resources/static/img/logo.ico')"
          }

      - name: Ensure instance folder exists
        shell: pwsh
        run: |
          if (-not (Test-Path "instance")) { New-Item -ItemType Directory -Path "instance" | Out-Null }

      - name: Init DB + seed (if scripts exist)
        shell: pwsh
        run: |
          if (Test-Path "init_db.py") { python init_db.py }
          if (Test-Path "seed_exam_rules.py") { python seed_exam_rules.py }
          if (Test-Path "seed_exams.py") { python seed_exams.py }

      - name: Create super admin (if script exists)
        shell: pwsh
        env:
          SUPER_USER: "CExamArena"
          SUPER_PASS: "CExamArena@2026"
        run: |
          if (Test-Path "create_superadmin.py") { python create_superadmin.py }

      - name: Build Server EXE (onefile)
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --clean --name ExamArena_Server --icon "src/resources/static/img/logo.ico" --add-data "src/resources;src/resources" --add-data "instance;instance" run.py

      - name: Build KeyGen EXE (onefile)
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --clean --name ExamArena_KeyGen --icon "src/resources/static/img/logo.ico" key_generator.py

      - name: Package offline setup folder
        shell: pwsh
        run: |
          if (Test-Path "ExamArena_Setup") { Remove-Item "ExamArena_Setup" -Recurse -Force }
          New-Item -ItemType Directory -Path "ExamArena_Setup" | Out-Null

          Copy-Item "dist/ExamArena_Server.exe" "ExamArena_Setup/" -Force
          Copy-Item "dist/ExamArena_KeyGen.exe" "ExamArena_Setup/" -Force

          if (Test-Path "Start_ExamArena.bat") { Copy-Item "Start_ExamArena.bat" "ExamArena_Setup/" -Force }
          if (Test-Path "instance") { Copy-Item "instance" "ExamArena_Setup/instance" -Recurse -Force }

          $lines = @(
            "EXAM ARENA - OFFLINE CBT SOFTWARE",
            "-----------------------------------",
            "1) Extract the folder to: C:\ExamArena\",
            "2) On the SERVER PC, run: Start_ExamArena.bat (recommended)",
            "   or run: ExamArena_Server.exe",
            "3) Login:",
            "   User: CExamArena",
            "   Pass: CExamArena@2026",
            "4) Students connect (same network):",
            "   http://SERVER-IP:8080"
          )
          Set-Content -Path "ExamArena_Setup/README.txt" -Value $lines -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamArena_Offline_Setup_Windows
          path: ExamArena_Setup
