name: Build ExamArena Windows App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip wheel setuptools
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          } else {
            pip install flask flask-sqlalchemy flask-wtf cryptography waitress reportlab pillow pyinstaller python-dotenv
          }

      - name: Prepare Icon (fallback if missing)
        shell: powershell
        run: |
          $iconPath = "src/resources/static/img/logo.ico"
          if (-not (Test-Path $iconPath)) {
            Write-Host "Icon not found, generating fallback..."
            python -c "from PIL import Image; img=Image.new('RGB',(64,64),(0,128,0)); img.save(r'src/resources/static/img/logo.ico')"
          }

      - name: Prepare instance folder (DB output target)
        shell: powershell
        run: |
          if (-not (Test-Path "instance")) { New-Item -ItemType Directory -Path "instance" | Out-Null }

      - name: Setup Database & Seed (optional but keeps your packaged instance ready)
        shell: powershell
        run: |
          if (Test-Path "init_db.py") {
            python init_db.py
          } else {
            Write-Host "init_db.py not found, skipping DB init"
          }

          if (Test-Path "seed_exam_rules.py") {
            python seed_exam_rules.py
          } else {
            Write-Host "seed_exam_rules.py not found, skipping rules seed"
          }

          # Create Super Admin if your app modules exist
          python -c "import sys; 
from importlib.util import find_spec; 
ok = (find_spec('src.app') is not None); 
print('Has src.app:', ok); 
sys.exit(0)"
          
          python -c "from src.app import create_app, db; from src.app.models import User; app=create_app(); ctx=app.app_context(); ctx.push(); db.create_all(); User.query.filter_by(username='CExamArena').delete(); admin=User(username='CExamArena', role='superadmin'); admin.set_password('CExamArena@2026'); db.session.add(admin); db.session.commit(); print('Admin Created');"

      - name: Build Server EXE
        shell: powershell
        run: |
          pyinstaller --noconsole --onefile --clean `
            --name "ExamArena_Server" `
            --icon "src/resources/static/img/logo.ico" `
            --add-data "src/resources;src/resources" `
            --add-data "instance;instance" `
            --collect-all flask `
            --collect-all flask_sqlalchemy `
            --collect-all flask_wtf `
            --collect-all cryptography `
            run.py

      - name: Build KeyGen EXE
        shell: powershell
        run: |
          pyinstaller --noconsole --onefile --clean `
            --name "ExamArena_KeyGen" `
            --icon "src/resources/static/img/logo.ico" `
            --collect-all cryptography `
            key_generator.py

      - name: Package Setup Folder
        shell: powershell
        run: |
          # Clean output folder
          if (Test-Path "ExamArena_Setup") { Remove-Item "ExamArena_Setup" -Recurse -Force }
          New-Item -ItemType Directory -Path "ExamArena_Setup" | Out-Null

          # README
          Set-Content -Path "ExamArena_Setup/README.txt" -Value @"
EXAM ARENA - OFFLINE CBT SOFTWARE
-----------------------------------
1. Extract this folder to C:\ExamArena\
2. Run ExamArena_Server.exe
3. Login:
   User: CExamArena
   Pass: CExamArena@2026

SUPPORT: 0808888888888
"@

          # Copy built EXEs
          Copy-Item "dist/ExamArena_Server.exe" "ExamArena_Setup/" -Force
          Copy-Item "dist/ExamArena_KeyGen.exe" "ExamArena_Setup/" -Force

          # Copy instance folder (DB)
          if (Test-Path "instance") {
            Copy-Item "instance" "ExamArena_Setup/instance" -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path "ExamArena_Setup/instance" | Out-Null
          }

          # (Optional) include resources alongside EXE too (handy for debugging)
          if (Test-Path "src/resources") {
            Copy-Item "src/resources" "ExamArena_Setup/resources" -Recurse -Force
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamArena_Windows_Setup
          path: ExamArena_Setup
