name: Build ExamArena Windows App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Comearean-main/Comearean-main

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install flask flask-sqlalchemy flask-wtf cryptography waitress reportlab pillow pyinstaller python-dotenv

      - name: Prepare Instance Folder
        shell: powershell
        run: |
          if (-not (Test-Path "instance")) {
            New-Item -ItemType Directory -Path "instance" | Out-Null
          }

      - name: Initialize Database
        shell: powershell
        run: |
          python init_db.py
          python seed_exam_rules.py

      - name: Create Super Admin
        shell: powershell
        run: |
          python create_superadmin.py

      - name: Build Server EXE
        shell: powershell
        run: |
          pyinstaller --noconsole --onefile --clean `
            --name "ExamArena_Server" `
            --icon "src/resources/static/img/logo.ico" `
            --add-data "src/resources;src/resources" `
            --add-data "instance;instance" `
            --collect-all flask `
            --collect-all flask_sqlalchemy `
            --collect-all flask_wtf `
            --collect-all cryptography `
            run.py

      - name: Build Key Generator EXE
        shell: powershell
        run: |
          pyinstaller --noconsole --onefile --clean `
            --name "ExamArena_KeyGen" `
            --icon "src/resources/static/img/logo.ico" `
            key_generator.py

      - name: Create Setup Folder
        shell: powershell
        run: |
          cd ..
          if (Test-Path "ExamArena_Setup") { Remove-Item ExamArena_Setup -Recurse -Force }
          New-Item -ItemType Directory -Path ExamArena_Setup | Out-Null

          Copy-Item "Comearean-main/dist/ExamArena_Server.exe" "ExamArena_Setup/" -Force
          Copy-Item "Comearean-main/dist/ExamArena_KeyGen.exe" "ExamArena_Setup/" -Force

          if (Test-Path "Comearean-main/instance") {
            Copy-Item "Comearean-main/instance" "ExamArena_Setup/instance" -Recurse -Force
          }

          Set-Content -Path "ExamArena_Setup/README.txt" -Value @"
EXAM ARENA CBT SOFTWARE

1. Extract folder
2. Run ExamArena_Server.exe
3. Login:
   Username: CExamArena
   Password: CExamArena@2026
"@

      - name: Upload Setup Package
        uses: actions/upload-artifact@v4
        with:
          name: ExamArena_Windows_Setup
          path: Comearean-main/ExamArena_Setup
