name: Build ExamArena Windows App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip wheel setuptools
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          } else {
            pip install flask flask-sqlalchemy flask-wtf cryptography waitress reportlab pillow pyinstaller python-dotenv
          }

      - name: Prepare Icon (fallback if missing)
        shell: powershell
        run: |
          $iconPath = "src/resources/static/img/logo.ico"
          if (-not (Test-Path $iconPath)) {
            Write-Host "Icon not found, generating fallback..."
            python -c "from PIL import Image; img=Image.new('RGB',(64,64),(0,128,0)); img.save(r'src/resources/static/img/logo.ico')"
          }

      - name: Ensure instance folder exists
        shell: powershell
        run: |
          if (-not (Test-Path "instance")) {
            New-Item -ItemType Directory -Path "instance" | Out-Null
          }

      - name: Init DB + Seed
        shell: powershell
        run: |
          if (Test-Path "init_db.py") { python init_db.py } else { Write-Host "init_db.py not found, skipping" }
          if (Test-Path "seed_exam_rules.py") { python seed_exam_rules.py } else { Write-Host "seed_exam_rules.py not found, skipping" }

      - name: Create Super Admin
        shell: powershell
        env:
          SUPER_USER: "CExamArena"
          SUPER_PASS: "CExamArena@2026"
        run: |
          if (Test-Path "create_superadmin.py") { python create_superadmin.py } else { Write-Host "create_superadmin.py not found, skipping" }

      - name: Build Server EXE
        shell: powershell
        run: |
          pyinstaller --noconsole --onefile --clean `
            --name "ExamArena_Server" `
            --icon "src/resources/static/img/logo.ico" `
            --add-data "src/resources;src/resources" `
            --add-data "instance;instance" `
            --collect-all flask `
            --collect-all flask_sqlalchemy `
            --collect-all flask_wtf `
            --collect-all cryptography `
            run.py

      - name: Build KeyGen EXE
        shell: powershell
        run: |
          pyinstaller --noconsole --onefile --clean `
            --name "ExamArena_KeyGen" `
            --icon "src/resources/static/img/logo.ico" `
            key_generator.py

      - name: Package Setup Folder
        shell: powershell
        run: |
          if (Test-Path "ExamArena_Setup") { Remove-Item "ExamArena_Setup" -Recurse -Force }
          New-Item -ItemType Directory -Path "ExamArena_Setup" | Out-Null

          # Copy artifacts from the dist folder
          Copy-Item "dist/ExamArena_Server.exe" "ExamArena_Setup/" -Force
          Copy-Item "dist/ExamArena_KeyGen.exe" "ExamArena_Setup/" -Force

          if (Test-Path "instance") {
            Copy-Item "instance" "ExamArena_Setup/instance" -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path "ExamArena_Setup/instance" | Out-Null
          }

          # SAFE METHOD: Using newline characters instead of Here-String to avoid YAML errors
          $text = "EXAM ARENA - OFFLINE CBT SOFTWARE`r`n-----------------------------------`r`n1) Extract folder to: C:\ExamArena\`r`n2) Run: ExamArena_Server.exe`r`n3) Login:`r`n   User: CExamArena`r`n   Pass: CExamArena@2026"
          Set-Content -Path "ExamArena_Setup/README.txt" -Value $text

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamArena_Windows_Setup
          path: ExamArena_Setup
